---
- name: Baseline Linux server preparation
  hosts: all
  become: true
  tasks:
    - name: Update apt cache on Debian/Ubuntu targets
      apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install essential diagnostic and utility packages
      package:
        name:
          - curl
          - vim
          - htop
          - net-tools
        state: present
